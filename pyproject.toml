[tool.poetry]
name = "telegram-assistant"
version = "0.1.0"
description = "A Telegram bot for summarizing unread messages and managing chats."
authors = ["ivanhahanov@gmail.com"]
license = "MIT"
readme = "README.md"
packages = [{include = "telegram_bot"}]

[tool.poetry.dependencies]
python-telegram-bot
telethon
redis
python-dotenv
langchain
langgraph


[tool.poetry.dev-dependencies]
pytest
black
flake8
mypy

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"